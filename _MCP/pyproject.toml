[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "massa-blender-mcp"
version = "1.0.0"
description = "Blender MCP server — Massa fork with GeoNode, material, cartridge, slot, and scene tools"
requires-python = ">=3.10"
dependencies = [
    "docutils",
    "mcp[cli]>=1.2.0",
    "pyyaml",
]

[project.scripts]
# Primary entry-point (used by Claude Code MCP config)
massa-blender-mcp = "blmcp:main"
# Keep original alias so existing configs still work
blender-mcp       = "blmcp:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"blmcp" = [
    # MCP prompt definitions.
    "data/prompts.yml",
    # Blender Python API reference.
    "data/api/**/*.rst",
    # Blender user manual.
    "data/manual/**/*.rst",
    # Vendored NodeToPython addon source used by ntp_snapshot_graph.
    "vendor/NodeToPython/**/*.py",
    # Vendored geonodes package source, demos, and markdown reference docs.
    "vendor/geonodes/**/*.py",
    "vendor/geonodes/**/*.md",
    "vendor/geonodes/LICENSE",
]

[tool.mypy]
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = [
    "blmcp", "blmcp.*",
    "blender_mcp_addon", "blender_mcp_addon.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "bpy", "bpy.*",
    "mcp", "mcp.*",
]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["blmcp/data"]

[tool.pylint.format]
max-line-length = 120

[tool.autopep8]
max_line_length = 120
ignore = [
    "E721",
    "E722",
    "E402",
    "W690",
]
aggressive = 2
